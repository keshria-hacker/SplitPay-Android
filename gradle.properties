# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# ── JVM ──────────────────────────────────────────────────────────────────────
# Tune based on available RAM. 2 GB is a reasonable minimum.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# ── Parallel builds ───────────────────────────────────────────────────────────
org.gradle.parallel=true

# ── Configuration cache (Gradle 9+) ──────────────────────────────────────────
# Caches the build configuration phase — dramatically speeds up repeated and CI
# builds. Set to "warn" during migration if you hit unsupported plugins.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# ── Build cache ───────────────────────────────────────────────────────────────
# Reuses task outputs from previous builds (local and remote).
org.gradle.caching=true

# ── AndroidX ─────────────────────────────────────────────────────────────────
android.useAndroidX=true
android.nonTransitiveRClass=true

# ── R8 full mode ─────────────────────────────────────────────────────────────
# Enables more aggressive dead-code elimination, inlining, and class merging.
# Results in a measurably smaller release APK/AAB. Safe for this project.
android.enableR8.fullMode=true

# ── Kotlin ────────────────────────────────────────────────────────────────────
kotlin.code.style=official
kotlin.incremental=true

# ── AGP compatibility ─────────────────────────────────────────────────────────
# AGP 9 includes built-in Kotlin support; the standalone Kotlin Android plugin
# is still applied explicitly, so keep the built-in path off.
android.builtInKotlin=false
android.newDsl=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
